<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MYWOD · GIMNASIO</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MYWOD">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c;
  --border:#2a2a2a; --border2:#383838;
  --accent:#ffd200;
  --text:#f2f2f2; --muted:#6a6a6a; --muted2:#3a3a3a;
  /* color-coding por día */
  --strength:#ffd200;          /* A · piernas pesado */
  --aerobic:#3fb6ff;           /* B · superior + correr */
  --quality:#ff5a3c;           /* C · potencia + saltos */
  --cond:#b47fff;              /* D · cuerpo completo + circuito largo */
  --surprise:#4cff88;          /* E · sorpresa */
  --good:#4cff88;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius:12px;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;position:fixed;width:100%;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
.view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(76px + var(--safe-bottom));}
.view.active{display:block;animation:viewFadeIn .18s ease;}
@keyframes viewFadeIn{from{opacity:0;}to{opacity:1;}}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* HEADER */
.app-header{padding:calc(10px + var(--safe-top)) 0 0;position:sticky;top:0;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid var(--border);}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:9px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;letter-spacing:2px;}
.logo span{color:var(--accent);}
.athlete-badge{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:5px 11px;}
.athlete-badge .as{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);white-space:nowrap;letter-spacing:.5px;}

/* MONTH TABS — segmented control */
.phase-tabs{display:flex;margin:0 16px 8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.phase-tab{flex:1;height:38px;padding:0 4px;background:transparent;border:none;border-right:1px solid var(--border);cursor:pointer;text-align:center;transition:var(--transition);touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.phase-tab:last-child{border-right:none;}
.phase-tab .pn{font-family:'Bebas Neue',sans-serif;font-size:15px;line-height:1;color:var(--muted);letter-spacing:1px;}
.phase-tab .pname{font-size:8px;color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px;text-transform:uppercase;letter-spacing:.5px;}
.phase-tab.active{background:var(--accent);}
.phase-tab.active .pn{color:#000;}
.phase-tab.active .pname{color:rgba(0,0,0,.6);}
.phase-tab.locked{opacity:.4;}

/* WEEK STRIP */
.week-strip{display:flex;gap:4px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;}
.week-strip::-webkit-scrollbar{display:none;}
.week-btn{flex-shrink:0;height:34px;min-width:52px;padding:0 9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;}
.week-btn .wmark{font-size:9px;}
.week-btn.deload{border-style:dashed;color:var(--muted2);}
.week-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}

/* DAY PILLS */
.day-row{display:flex;gap:5px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;}
.day-row::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;height:36px;padding:0 13px;background:var(--surface);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:var(--transition);touch-action:manipulation;display:flex;align-items:center;gap:7px;}
.day-pill .dl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);font-weight:500;}
.day-pill .dt{font-size:11px;font-weight:600;white-space:nowrap;}
.day-pill.strength .dt{color:var(--strength);}
.day-pill.aerobic .dt{color:var(--aerobic);}
.day-pill.quality .dt{color:var(--quality);}
.day-pill.cond .dt{color:var(--cond);}
.day-pill.surprise .dt{color:var(--surprise);}
.day-pill.active{border-width:1.5px;}
.day-pill.active.strength{border-color:var(--strength);background:rgba(255,210,0,.08);}
.day-pill.active.aerobic{border-color:var(--aerobic);background:rgba(63,182,255,.1);}
.day-pill.active.quality{border-color:var(--quality);background:rgba(255,90,60,.1);}
.day-pill.active.cond{border-color:var(--cond);background:rgba(180,127,255,.1);}
.day-pill.active.surprise{border-color:var(--surprise);background:rgba(76,255,136,.1);}
.day-pill.active .dl{color:var(--text);}
.day-pill .opt{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted2);}

/* SESSION TOP */
.session-top{padding:14px 16px 0;}
.session-title-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.session-title{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;}
.session-badge{font-size:8px;text-transform:uppercase;letter-spacing:2px;padding:3px 9px;border-radius:100px;font-weight:600;}
.session-badge.strength{background:rgba(255,210,0,.12);color:var(--strength);}
.session-badge.aerobic{background:rgba(63,182,255,.12);color:var(--aerobic);}
.session-badge.quality{background:rgba(255,90,60,.12);color:var(--quality);}
.session-badge.cond{background:rgba(180,127,255,.12);color:var(--cond);}
.session-badge.surprise{background:rgba(76,255,136,.12);color:var(--surprise);}
.session-meta{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;display:flex;gap:10px;flex-wrap:wrap;}
.block-banner{margin:10px 16px 0;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-left:2.5px solid var(--accent);border-radius:0 8px 8px 0;font-size:10px;color:var(--muted);line-height:1.6;}
.block-banner strong{color:var(--text);}
.bflag{display:inline-block;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.5px;padding:1px 6px;border-radius:100px;margin-left:5px;vertical-align:middle;background:rgba(106,106,106,.15);color:var(--muted);border:1px solid var(--border2);}

/* SECTION LABEL */
.section-label{font-size:8px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:8px;font-family:'DM Mono',monospace;}

.exercises{padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.wnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);min-width:16px;}

/* WARM-UP CARD */
.warm-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--radius);padding:11px 13px;animation:fadeUp .25s ease both;}
.warm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.warm-title{font-size:12px;font-weight:600;color:var(--text);}
.warm-dur{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.warm-steps{display:flex;flex-direction:column;gap:6px;}
.warm-step{display:flex;gap:8px;font-size:11px;color:var(--muted);line-height:1.5;}
.warm-step b{color:var(--text);font-weight:500;}
.warm-dot{color:var(--muted2);font-family:'DM Mono',monospace;font-size:9px;padding-top:1px;min-width:14px;}

/* RUN CARD */
.run-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--aerobic);border-radius:var(--radius);padding:14px;animation:fadeUp .25s ease both;}
.run-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.run-presc{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1.05;letter-spacing:.5px;}
.run-cue{font-size:11px;color:var(--muted);line-height:1.6;}

/* EXERCISE CARDS (fuerza) */
.ex-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-left-color:var(--strength);border-radius:var(--radius);overflow:hidden;animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.ex-main{padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.ex-num{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1.2;color:var(--border2);min-width:20px;}
.ex-info{flex:1;min-width:0;}
.ex-role{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.ex-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3;}
.ex-params{display:flex;gap:4px;flex-wrap:wrap;}
.pchip{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.pchip.scheme{color:var(--accent);border-color:rgba(255,210,0,.3);}
.ex-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.6;}

/* SUPERSET / ZONA MEDIA CARD */
.ss-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--good);border-radius:var(--radius);overflow:hidden;animation:fadeUp .25s ease both;}
.ss-head{display:flex;align-items:center;gap:8px;padding:11px 14px 0;}
.ss-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--good);}
.ss-rounds{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.ss-moves{padding:8px 14px 12px;display:flex;flex-direction:column;gap:5px;}
.ss-move{display:flex;align-items:baseline;gap:8px;padding:7px 9px;background:var(--surface2);border-radius:6px;}
.ss-mdot{font-family:'DM Mono',monospace;font-size:9px;color:var(--good);}
.ss-mname{font-size:12px;color:var(--text);line-height:1.4;}

/* CIRCUIT CARD */
.hiit-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cond);border-radius:var(--radius);overflow:hidden;animation:fadeUp .25s ease both;}
.hiit-head{padding:11px 13px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hiit-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--cond);background:rgba(180,127,255,.1);padding:3px 9px;border-radius:100px;border:1px solid rgba(180,127,255,.25);}
.hiit-dur{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:right;}
.hiit-title{font-size:14px;font-weight:600;padding:8px 13px 3px;line-height:1.35;}
.hiit-scheme{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--accent);padding:2px 13px 4px;}
.hiit-rounds{padding:6px 13px 12px;display:flex;flex-direction:column;gap:4px;}
.hiit-round{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--surface2);border-radius:6px;}
.hiit-rnum{font-family:'DM Mono',monospace;font-size:9px;color:var(--cond);min-width:16px;}
.hiit-rdesc{font-size:11px;flex:1;color:var(--text);line-height:1.4;}
.hiit-note{font-size:10px;color:var(--muted);font-style:italic;line-height:1.6;padding:0 13px 12px;}

/* REFERENCIA (info) */
.info-header{padding:calc(18px + var(--safe-top)) 16px 12px;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);}
.info-title{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;margin-bottom:2px;}
.info-body{padding:12px 16px 24px;}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.info-card-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--accent);margin-bottom:9px;letter-spacing:.5px;}
.info-p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.info-p:last-child{margin-bottom:0;}
.info-p strong{color:var(--text);font-weight:600;}
.fmt-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--border);}
.fmt-row:last-child{border-bottom:none;}
.fmt-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.5px;}
.fmt-desc{font-size:11px;color:var(--muted);line-height:1.6;}
.gloss-cat{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:12px 0 4px;}
.gloss-cat:first-child{margin-top:0;}
.gloss-row{padding:9px 0;border-bottom:1px solid var(--border);}
.gloss-row:last-child{border-bottom:none;}
.gloss-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;}
.gloss-desc{font-size:11px;color:var(--muted);line-height:1.6;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(2,1fr);z-index:100;padding:0 0 calc(4px + var(--safe-bottom));}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;cursor:pointer;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;transition:color .18s;min-height:50px;touch-action:manipulation;}
.nav-btn.active{color:var(--accent);}
.nav-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav-label{font-size:8px;text-transform:uppercase;letter-spacing:.8px;}
</style>
</head>
<body>

<!-- WORKOUT -->
<div id="view-workout" class="view active">
  <div class="app-header">
    <div class="header-row">
      <div class="logo">MY<span>WOD</span></div>
      <div class="athlete-badge"><div class="as">GIMNASIO · 4 DÍAS + 1</div></div>
    </div>
    <div class="phase-tabs" id="month-tabs"></div>
    <div class="week-strip" id="week-strip"></div>
    <div class="day-row" id="day-row"></div>
  </div>
  <div class="session-top">
    <div class="session-title-row">
      <div class="session-title" id="sess-title">Día A</div>
      <div class="session-badge strength" id="sess-badge">PIERNAS</div>
    </div>
    <div class="session-meta"><span id="sess-month">Mes 1</span><span id="sess-week">Semana 1/4</span></div>
  </div>
  <div class="block-banner" id="block-banner"></div>
  <div class="exercises" id="exercises-container"></div>
</div>

<!-- REFERENCIA -->
<div id="view-info" class="view">
  <div class="info-header"><div class="info-title">REFERENCIA</div></div>
  <div class="info-body" id="info-body"></div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchView('workout',this)">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-8 4 16 3-8h2"/></svg></span>
    <span class="nav-label">Hoy</span>
  </button>
  <button class="nav-btn" onclick="switchView('info',this)">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
    <span class="nav-label">Referencia</span>
  </button>
</div>

<script>
// =====================================================================
// META DE DÍAS (roles fijos) + colores
// =====================================================================
const DAY_META = {
  A:{type:'strength', short:'Piernas',   badge:'PIERNAS',  title:'Piernas pesado'},
  B:{type:'aerobic', short:'Superior',   badge:'SUPERIOR', title:'Tren superior (empuje/tracción) + correr'},
  C:{type:'quality', short:'Potencia',   badge:'POTENCIA', title:'Potencia + saltos'},
  D:{type:'cond',    short:'Cuerpo',     badge:'CUERPO',   title:'Cuerpo completo + circuito largo'},
  E:{type:'surprise',short:'Sorpresa',   badge:'SORPRESA', title:'Día sorpresa (opcional)',optional:true},
};
const DAY_ORDER = ['A','B','C','D','E'];
const ACCENT = {strength:'#ffd200',aerobic:'#3fb6ff',quality:'#ff5a3c',cond:'#b47fff',surprise:'#4cff88'};

// Formatos de circuito
const FMT = {
  FOR_TIME:{name:'Lo más rápido posible',   tag:'POR TIEMPO'},
  AMRAP:   {name:'Mayor cantidad de vueltas',tag:'AMRAP'},
  EMOM:    {name:'Por minuto',              tag:'EMOM'},
  CHIPPER: {name:'Lista corrida',           tag:'CHIPPER'},
  CONTROL: {name:'Circuito controlado',     tag:'CONTROLADO'},
};

// Entrada en calor (igual todos los días de fuerza)
const WARMUP = {dur:'8–10 min',steps:[
  ['Suave 3–4 min','soga, trote en el lugar o caminar rápido, hasta entrar en temperatura.'],
  ['Movilidad de la zona del día','en pierna: cadera y tobillos (sentadillas profundas sin peso, balanceos). En tren superior: hombros (círculos de brazos, banda o palo).'],
  ['2 vueltas de activación','10 sentadillas libres + 10 flexiones + 10 abdominales, tranquilo.'],
  ['Series de aproximación','2–3 series livianas subiendo el peso hasta el de trabajo (no cuentan como las series del ejercicio).'],
]};

// =====================================================================
// GLOSARIO DE EJERCICIOS (por categoría)
// =====================================================================
const GLOSARIO = [
  {cat:'Piernas y cadera', items:[
    {name:'Sentadilla con barra', desc:'Barra apoyada en la espalda. Bajás hasta que los muslos queden al menos paralelos al piso y subís.'},
    {name:'Sentadilla frontal', desc:'Igual que la anterior pero con la barra apoyada adelante, sobre los hombros. Trabaja más los cuádriceps y obliga a mantener el tronco derecho.'},
    {name:'Sentadilla goblet', desc:'Sostenés una mancuerna con las dos manos contra el pecho y hacés la sentadilla.'},
    {name:'Peso muerto (clásico)', desc:'La barra en el piso, la levantás con la espalda firme hasta quedar parado, y la bajás controlada hasta el piso.'},
    {name:'Peso muerto rumano', desc:'Con la barra por delante, bajás el peso con las piernas casi rectas (una rodilla apenas flexionada), empujando la cola hacia atrás. La barra baja hasta la mitad de la canilla, no toca el piso. Trabaja la parte de atrás de la pierna.'},
    {name:'Peso muerto rumano a una pierna', desc:'El mismo movimiento pero parado en una sola pierna, con una mancuerna en la mano del lado contrario; la otra pierna se estira hacia atrás para hacer contrapeso. Una pierna por vez. Trabaja equilibrio y la parte de atrás de la pierna.'},
    {name:'Buenos días', desc:'Con la barra en la espalda (como para sentadilla), inclinás el tronco hacia adelante con las piernas casi rectas y la espalda firme, hasta quedar casi paralelo al piso, y volvés. Trabaja la parte de atrás de la pierna y la zona lumbar.'},
    {name:'Sentadilla búlgara', desc:'Un pie atrás apoyado sobre un cajón o banco; hacés la sentadilla con la pierna de adelante. Una pierna por vez.'},
    {name:'Zancadas caminando', desc:'Con una mancuerna en cada mano, avanzás dando pasos largos y bajando la rodilla de atrás casi al piso.'},
    {name:'Subidas al cajón (step-ups)', desc:'Con una mancuerna en cada mano, subís un pie al cajón y te impulsás hasta quedar parado arriba. Una pierna por vez.'},
    {name:'Elevaciones de gemelos', desc:'Parado (con mancuernas en las manos para sumar peso), subís los talones parándote en la punta de los pies y bajás controlado. Trabaja los gemelos.'},
  ]},
  {cat:'Empuje (pecho, hombro y tríceps)', items:[
    {name:'Press militar', desc:'Parado, empujás la barra desde los hombros hacia arriba hasta estirar los brazos.'},
    {name:'Press de banca con mancuernas', desc:'Acostado en el banco, empujás las dos mancuernas hacia arriba.'},
    {name:'Press inclinado con mancuernas', desc:'Igual pero con el banco inclinado; pega más arriba del pecho.'},

function run(presc,cue){return {k:'run',presc,cue};}
function circ(o){return Object.assign({k:'circ'},o);}

// =====================================================================
// STATE (solo posición: mes / semana / día)
// =====================================================================
let S={month:1,week:1,day:'A'};
function currentMonth(){return PROGRAM.months.find(m=>m.n===S.month)||PROGRAM.months[0];}
function currentWeek(){const m=currentMonth();return m.weeks.find(w=>w.n===S.week)||m.weeks[0];}

function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem('mywod_v9')||'{}');
    ['month','week','day'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
  }catch(e){}
  const m=PROGRAM.months.find(x=>x.n===S.month);
  if(!m)S.month=PROGRAM.months[0].n;
  if(!currentMonth().weeks.find(w=>w.n===S.week))S.week=currentMonth().weeks[0].n;
  if(DAY_ORDER.indexOf(S.day)<0)S.day='A';
}
function saveState(){
  try{localStorage.setItem('mywod_v9',JSON.stringify({month:S.month,week:S.week,day:S.day}));}catch(e){}
}

// =====================================================================
// RENDER HEADER
// =====================================================================
function renderHeader(){
  const mt=document.getElementById('month-tabs');mt.innerHTML='';
  PROGRAM.months.forEach(m=>{
    const el=document.createElement('div');
    el.className='phase-tab'+(m.n===S.month?' active':'');
    el.innerHTML='<div class="pn">M'+m.n+'</div><div class="pname">'+m.name+'</div>';
    el.onclick=()=>{S.month=m.n;S.week=m.weeks[0].n;saveState();renderHeader();renderSession();};
    mt.appendChild(el);
  });
  const soon=document.createElement('div');
  soon.className='phase-tab locked';
  soon.innerHTML='<div class="pn">M2</div><div class="pname">Próximo</div>';
  mt.appendChild(soon);

  const ws=document.getElementById('week-strip');ws.innerHTML='';
  currentMonth().weeks.forEach(w=>{
    const btn=document.createElement('div');
    btn.className='week-btn'+(w.n===S.week?' active':'')+(w.deload?' deload':'');
    btn.innerHTML='S'+w.n+(w.deload?'<span class="wmark">↓</span>':'');
    btn.onclick=()=>{S.week=w.n;saveState();renderHeader();renderSession();};
    ws.appendChild(btn);
  });

  const dr=document.getElementById('day-row');dr.innerHTML='';
  DAY_ORDER.forEach(k=>{
    const dm=DAY_META[k];
    const pill=document.createElement('div');
    pill.className='day-pill '+dm.type+(k===S.day?' active':'');
    pill.innerHTML='<div class="dl">'+k+'</div><div class="dt">'+dm.short+'</div>'+(dm.optional?'<div class="opt">opc</div>':'');
    pill.onclick=()=>{S.day=k;saveState();renderSession();renderHeader();};
    dr.appendChild(pill);
  });
}

// =====================================================================
// RENDER SESSION
// =====================================================================
function sectionLabel(t){const d=document.createElement('div');d.className='section-label';d.textContent=t;return d;}

function renderSession(){
  const w=currentWeek(),dm=DAY_META[S.day];
  document.getElementById('sess-title').textContent='Día '+S.day+' · '+dm.short;
  const badge=document.getElementById('sess-badge');
  badge.textContent=dm.badge;badge.className='session-badge '+dm.type;
  document.getElementById('sess-month').textContent=currentMonth().name+' · '+w.theme;
  document.getElementById('sess-week').textContent='Semana '+w.n+'/'+currentMonth().weeks.length;
  let flags='';
  if(w.deload)flags+='<span class="bflag">SEMANA LIVIANA</span>';
  if(dm.optional)flags+='<span class="bflag">OPCIONAL</span>';
  document.getElementById('block-banner').innerHTML='<strong>'+dm.title+'</strong> · '+w.note+' '+flags;

  const cont=document.getElementById('exercises-container');cont.innerHTML='';
  const accent=ACCENT[dm.type];

  if(!dm.optional){ cont.appendChild(sectionLabel('Entrada en calor')); renderWarmup(cont); }

  const blocks=(w.days[S.day]||[]);
  let lastGroup=null,n=0;
  blocks.forEach(b=>{
    const group=groupOf(b);
    if(group!==lastGroup){cont.appendChild(sectionLabel(group));lastGroup=group;}
    n++;
    if(b.k==='heavy')renderHeavy(cont,b,n,dm.type);
    else if(b.k==='super'||b.k==='core')renderSuper(cont,b,accent,n);
    else if(b.k==='run')renderRun(cont,b,n);
    else if(b.k==='circ')renderCirc(cont,b,accent,n);
  });
}
function groupOf(b){
  if(b.k==='heavy')return b.role==='secundaria'?'Fuerza secundaria':'Fuerza principal';
  if(b.k==='super')return 'Superseries';
  if(b.k==='core')return 'Zona media';
  if(b.k==='run')return 'Correr';
  return 'Circuito';
}

function renderWarmup(cont){
  const card=document.createElement('div');card.className='warm-card';
  card.innerHTML='<div class="warm-top"><span class="warm-title">Entrada en calor</span><span class="warm-dur">'+WARMUP.dur+'</span></div>'+
    '<div class="warm-steps">'+WARMUP.steps.map((s,i)=>'<div class="warm-step"><span class="warm-dot">'+String(i+1).padStart(2,'0')+'</span><span><b>'+s[0]+':</b> '+s[1]+'</span></div>').join('')+'</div>';
  cont.appendChild(card);
}

function renderHeavy(cont,b,n,type){
  const rest=b.role==='secundaria'?'1–2 min':'2–3 min';
  const roleLabel=b.role==='secundaria'?'Fuerza secundaria':'Fuerza principal';
  const card=document.createElement('div');card.className='ex-card';card.dataset.type=type;
  card.style.borderLeftColor=ACCENT[type];
  card.innerHTML=
    '<div class="ex-main">'+
      '<div class="ex-num">'+String(n).padStart(2,'0')+'</div>'+
      '<div class="ex-info">'+
        '<div class="ex-role">'+roleLabel+'</div>'+
        '<div class="ex-name">'+b.name+'</div>'+
        '<div class="ex-params"><span class="pchip scheme">'+b.scheme+'</span><span class="pchip">descanso '+rest+'</span></div>'+
        (b.note?'<div class="ex-note">'+b.note+'</div>':'')+
      '</div>'+
    '</div>';
  cont.appendChild(card);
}

function renderSuper(cont,b,accent,n){
  const isCore=b.k==='core';
  const label=isCore?'Zona media':(b.label||'Superserie');
  const sub=isCore?('×'+b.rounds+' vueltas'):('×'+b.rounds+' vueltas · sin descanso en el medio');
  const card=document.createElement('div');card.className='ss-card';card.style.borderLeftColor=accent;
  card.innerHTML=
    '<div class="ss-head"><span class="wnum">'+String(n).padStart(2,'0')+'</span><span class="ss-badge" style="color:'+accent+'">'+label+'</span><span class="ss-rounds">'+sub+'</span></div>'+
    '<div class="ss-moves">'+b.moves.map(m=>'<div class="ss-move"><span class="ss-mdot" style="color:'+accent+'">▸</span><span class="ss-mname">'+m+'</span></div>').join('')+'</div>';
  cont.appendChild(card);
}

function renderRun(cont,b,n){
  const card=document.createElement('div');card.className='run-card';
  card.innerHTML='<div class="run-head"><span class="wnum">'+String(n).padStart(2,'0')+'</span><span class="ss-badge" style="color:var(--aerobic)">Correr</span></div>'+
    '<div class="run-presc">'+b.presc+'</div>'+(b.cue?'<div class="run-cue">'+b.cue+'</div>':'');
  cont.appendChild(card);
}

function renderCirc(cont,b,accent,n){
  const f=FMT[b.fmt]||{name:b.fmt,tag:b.fmt};
  const card=document.createElement('div');card.className='hiit-card';card.style.borderLeftColor=accent;
  const title=b.name?('<span style="color:'+accent+'">'+b.name+'</span> · '+b.title):b.title;
  let html='<div class="hiit-head"><span class="hiit-badge" style="color:'+accent+';background:transparent;border-color:'+accent+'">'+f.tag+'</span><span class="hiit-dur">'+(b.dur||'')+'</span></div>'+
    '<div class="hiit-title">'+title+'</div>';
  html+='<div class="hiit-note" style="padding-top:2px;font-style:normal;color:'+accent+'">'+f.name+'</div>';
  if(b.scheme)html+='<div class="hiit-scheme">'+b.scheme+'</div>';
  if(b.steps&&b.steps.length)html+='<div class="hiit-rounds">'+b.steps.map((s,i)=>'<div class="hiit-round"><span class="hiit-rnum" style="color:'+accent+'">'+String(i+1).padStart(2,'0')+'</span><span class="hiit-rdesc">'+s+'</span></div>').join('')+'</div>';
  if(b.note)html+='<div class="hiit-note">'+b.note+'</div>';
  card.innerHTML=html;
  cont.appendChild(card);
}

function renderRef(){
  const c=document.getElementById('info-body');c.innerHTML='';

  // Cómo leer
  const read=document.createElement('div');read.className='info-card';
  read.innerHTML='<div class="info-card-title">Cómo leer esto</div>'+
    '<p class="info-p"><strong>"5×3", "4×8", etc.</strong> El primer número son las series (las veces que repetís el ejercicio, con descanso en el medio). El segundo son las repeticiones dentro de cada serie. Ejemplo: "5×3" = 5 series de 3 repeticiones.</p>'+
    '<p class="info-p"><strong>Superserie.</strong> Dos ejercicios que hacés uno atrás del otro sin descanso; recién descansás cuando terminaste los dos, y ahí volvés a empezar la vuelta. Algunos días tienen dos superseries seguidas (Superserie 1 y 2): son bloques distintos, cada uno con su par de ejercicios.</p>'+
    '<p class="info-p"><strong>Descanso.</strong> En la fuerza pesada, 2 a 3 minutos entre series (es lo que te permite cargar pesado). En la fuerza secundaria, 1 a 2 minutos. En superseries, circuitos y zona media, el descanso es corto o no hay.</p>'+
    '<p class="info-p"><strong>Cada sesión dura entre 60 y 75 minutos.</strong> El orden es siempre: entrada en calor → fuerza principal → fuerza secundaria → superserie(s) → zona media → circuito. Si te vas de tiempo, recortá una superserie o el descanso, nunca el peso de los ejercicios principales.</p>';
  c.appendChild(read);

  // Entrada en calor
  const warm=document.createElement('div');warm.className='info-card';
  warm.innerHTML='<div class="info-card-title">Entrada en calor (todos los días)</div>'+
    '<p class="info-p">Nunca arranques frío. Antes de cada sesión, '+WARMUP.dur+':</p>'+
    WARMUP.steps.map(s=>'<p class="info-p"><strong>'+s[0]+':</strong> '+s[1]+'</p>').join('');
  c.appendChild(warm);

  // Formatos de circuito
  const fmt=document.createElement('div');fmt.className='info-card';
  fmt.innerHTML='<div class="info-card-title">Formatos de circuito</div>'+
    fmtRow('POR TIEMPO','Lo más rápido posible: hacés todo el trabajo indicado lo más rápido que puedas y anotás cuánto tardaste.')+
    fmtRow('AMRAP','Mayor cantidad de vueltas (en X minutos): repetís la misma ronda una y otra vez durante el tiempo marcado, y contás cuántas vueltas completaste.')+
    fmtRow('EMOM','Por minuto: cada minuto arranca un ejercicio distinto. Terminás las repeticiones y lo que te sobra del minuto es tu descanso, hasta que empieza el siguiente.')+
    fmtRow('CHIPPER','Lista corrida: una lista larga de ejercicios que hacés una sola vez, de arriba hacia abajo, lo más rápido posible.')+
    fmtRow('CONTROLADO','Circuito sin correr contrarreloj: hacés las vueltas a ritmo tranquilo, priorizando la técnica.');
  c.appendChild(fmt);

  // Estructura de la semana
  const wk=document.createElement('div');wk.className='info-card';
  wk.innerHTML='<div class="info-card-title">Estructura de la semana</div>'+
    '<p class="info-p">Son 4 días fijos con roles distintos, más un 5º opcional que sumás si te da el cuerpo. Los roles no cambian; lo que va adentro cambia todas las semanas.</p>'+
    DAY_ORDER.map(k=>'<p class="info-p"><strong>Día '+k+' — '+DAY_META[k].title+'</strong></p>').join('')+
    '<p class="info-p" style="margin-top:6px">Cada día combina fuerza principal + fuerza secundaria + superserie(s) + zona media (core) + un circuito (o correr en el Día B).</p>';
  c.appendChild(wk);

  // Glosario
  const gl=document.createElement('div');gl.className='info-card';
  gl.innerHTML='<div class="info-card-title">Glosario de ejercicios</div>'+
    GLOSARIO.map(cat=>'<div class="gloss-cat">'+cat.cat+'</div>'+
      cat.items.map(g=>'<div class="gloss-row"><div class="gloss-name">'+g.name+'</div><div class="gloss-desc">'+g.desc+'</div></div>').join('')
    ).join('');
  c.appendChild(gl);

  // Progreso
  const pr=document.createElement('div');pr.className='info-card';pr.style.marginBottom='20px';
  pr.innerHTML='<div class="info-card-title">Para medir si vas mejorando</div>'+
    '<p class="info-p">Anotá de vez en cuando:</p>'+
    '<p class="info-p">• El peso máximo que movés en <strong>sentadilla, peso muerto y press militar</strong>.</p>'+
    '<p class="info-p">• El resultado de <strong>"Cindy"</strong> (Día E de la Semana 1). Cuando la repitas el mes que viene, vas a ver si hiciste más vueltas.</p>'+
    '<p class="info-p">Si esos números suben con el tiempo, estás mejor. Si no, ajustamos.</p>';
  c.appendChild(pr);
}
function fmtRow(tag,desc){return '<div class="fmt-row"><div class="fmt-tag">'+tag+'</div><div class="fmt-desc">'+desc+'</div></div>';}

// VIEW SWITCHING
// =====================================================================
function switchView(view,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  btn.classList.add('active');
  if(view==='info')renderRef();
}

// INIT
loadState();renderHeader();renderSession();
